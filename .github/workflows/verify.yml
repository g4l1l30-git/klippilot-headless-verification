name: Isolated Windows headless verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare FFmpeg on disposable runner
        shell: powershell
        run: |
          $result=Start-Process choco -ArgumentList 'install ffmpeg --yes --no-progress --limit-output' -Wait -PassThru -NoNewWindow -RedirectStandardOutput choco.log -RedirectStandardError choco-error.log
          if ($result.ExitCode) { Write-Output 'FFMPEG_SETUP_FAILED'; exit 1 }
          'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Reconstruct private buyer ZIP
        env:
          KLP_ZIP_0: ${{ secrets.KLP_ZIP_0 }}
          KLP_ZIP_1: ${{ secrets.KLP_ZIP_1 }}
          KLP_ZIP_2: ${{ secrets.KLP_ZIP_2 }}
          KLP_ZIP_3: ${{ secrets.KLP_ZIP_3 }}
          KLP_ZIP_4: ${{ secrets.KLP_ZIP_4 }}
        run: python reconstruct.py
      - name: Test extracted buyer install and synthetic workflow
        run: python run_headless.py
